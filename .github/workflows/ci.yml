name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix: { module: [apps/core, apps/agent, infrastructure/chaos-lab/demo-service] }
    defaults: { run: { working-directory: "${{ matrix.module }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: go vet ./...
      - run: go test ./... -race
  intelligence:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/intelligence } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pytest -q
  dashboard:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install
      - run: npm test
      - run: npm run build
